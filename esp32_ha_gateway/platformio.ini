; ============================================================
; SHISON 加热器 ESP32 BLE->MQTT 网关 (PlatformIO / Arduino)
; 用法: 用 VS Code + PlatformIO 打开本目录, 改 src/main.cpp 顶部配置后烧录
; 板型: ESP32 (经典双模, 如 ESP32 DevKitC / NodeMCU-32S)
; ============================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.3
